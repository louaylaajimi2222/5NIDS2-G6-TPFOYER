version: '3.8'  # Specify the version of the Docker Compose file

services:
  db:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: student
      MYSQL_USER: admin
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - data_mysql:/var/lib/mysql
    networks:
      - my-network
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 200M

  app:
    image: louay222/fy:9.0.0  # Replace with your Spring Boot image name
    depends_on:
      - db
    ports:
      - "8088:8089"
    environment:
      SPRING_APPLICATION_JSON: '{
        "spring.datasource.url": "jdbc:mysql://db:3306/student?createDatabaseIfNotExist=true",
        "spring.datasource.username": "admin",
        "spring.datasource.password": "root",
        "spring.jpa.properties.hibernate.dialect": "org.hibernate.dialect.MySQLDialect",
        "spring.jpa.hibernate.ddl-auto": "update"
      }'
    networks:
      - my-network
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 300M
networks:
  my-network:
    driver: bridge

volumes:
  data_mysql: {}
